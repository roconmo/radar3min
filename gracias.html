<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Gracias! | Radar3Min</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    :root {
      --sage-dark: #2c5f4a;
      --sage:      #3d7a60;
      --red:       #c0392b;
      --cream:     #faf7f2;
      --ink:       #1a2e28;
      --muted:     #6b7f78;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 8px 28px rgba(28,50,42,0.10);
    }
    .icon {
      width: 72px;
      height: 72px;
      background: #eaf3ee;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon svg { width: 36px; height: 36px; }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--sage-dark);
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background: var(--sage-dark);
      color: white;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--sage); }

    /* brand logo */
    .brand-wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      text-decoration: none;
      margin-bottom: 2rem;
    }
    .brand-name { font-size: 1.5rem; font-weight: 700; line-height: 1; letter-spacing: -0.01em; }
    .brand-bracket { color: var(--red); }
    .brand-letter  { color: var(--sage-dark); }
    .brand-ous     { color: var(--sage-dark); font-weight: 700; }
    .brand-sub {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
      margin-left: 2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <a class="brand-wrap" href="/" aria-label="ROUS Digital Projects">
      <span class="brand-name">
        <span class="brand-bracket">[</span><span class="brand-letter">R</span><span class="brand-bracket">]</span><span class="brand-ous">OUS</span>
      </span>
      <span class="brand-sub">Digital Projects</span>
    </a>

    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2c5f4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <h1>¡Solicitud recibida!</h1>
    <p>
      Gracias por tu interés en <strong>Radar3Min</strong>.<br>
      Nos pondremos en contacto contigo en menos de 24 h para organizar tu demo personalizada.
    </p>

    <a class="btn" href="https://radar.rosaliacontrerasmoreira.com">← Volver a la web</a>
  </div>
</body>
</html>
